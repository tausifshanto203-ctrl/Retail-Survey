 ()=>`<input id=q type=search placeholder="Search SKU, flavour, brand…" value="${E(S.q)}"><p class=mut>Tick every SKU you can see in this shop.</p><div id=skl></div>`,
 ()=>`<h2>In this shop, Dan Cake muffin sold in a box or Open?</h2><div class=g2>${['Box','Open'].map(v=>`<button class="chip ${S.muf===v?'on':''}" data-m="${v}">${v}</button>`).join('')}</div>`,
 ()=>`<div class=card>${ed(0)}<b>Area</b><p>${AN(S.area)} → ${S.sub}</p></div><div class=card>${ed(1)}<b>Shop</b><p>${E(S.shop)}<br>${E(S.addr)}</p></div><div class=card>${ed(2)}<b>Dan Cake SKUs (${dan.length})</b><ul>${li(dan)}</ul></div><div class=card>${ed(2)}<b>Competitor SKUs (${cmp.length})</b><ul>${li(cmp)}</ul></div><div class=card>${ed(3)}<b>Muffin selling format</b><p>${E(S.muf)}</p></div>`+(S.dup?'<div class="card warn">A survey for this shop was already submitted today. Tap “Submit anyway” only if this is a different visit.</div>':'')][s]();
 n.innerHTML=(s===2?'<div class=tot id=tot></div>':'')+(s?'<button class=btn id=back>← Back</button>':'')+`<button class="btn p" id=next ${S.busy?'disabled':''}>${s===4?(S.dup?'SUBMIT ANYWAY':'SUBMIT SURVEY'):s===3?'Review →':'Next →'}</button>`;
 if(s===2)renderList()}
function renderList(){
 const q=S.q.toLowerCase().trim(),g={};
 act().forEach(x=>{if(q&&!`${x.brand} ${x.name} ${x.flav} ${x.wt} ${x.mfr}`.toLowerCase().includes(q))return;(g[x.brand]=g[x.brand]||[]).push(x)});
 const o=Object.keys(g).sort((a,b)=>a==='Dan Cake'?-1:b==='Dan Cake'?1:0);
 $('#skl').innerHTML=o.map(b=>`<details ${q||b==='Dan Cake'?'open':''}><summary>${E(b)}${b==='Dan Cake'?' (ours)':''}<span class=gc data-b="${E(b)}"></span></summary>${g[b].map(x=>`<div class="sku ${S.sel.has(x.id)?'on':''}"><label class=sk><input type=checkbox data-id=${x.id} ${S.sel.has(x.id)?'checked':''}><span>${E(x.name)}<small>${E(x.flav)}</small></span><em>${E(x.wt)}<br>${price(x.mrp)}</em></label><div class=qt><span>Quantity in shop</span><button class=qb data-q=-1 data-id=${x.id}>−</button><input class=qi type=number inputmode=numeric min=1 data-id=${x.id} value=${S.sel.get(x.id)||1}><button class=qb data-q=1 data-id=${x.id}>+</button></div></div>`).join('')}</details>`).join('')||'<p class=mut>No match.</p>';
 counts()}
function counts(){const c={};act().forEach(x=>{if(S.sel.has(x.id))c[x.brand]=(c[x.brand]||0)+1});$$('.gc').forEach(e=>e.textContent=c[e.dataset.b]?'✓ '+c[e.dataset.b]:'');const t=$('#tot');if(t)t.textContent=S.sel.size+' SKUs selected'}
async function submit(){
 if(S.busy)return;
 const nk=s=>(s.ac+s.sub+s.shop).toLowerCase().replace(/\W+/g,'');
 const rec={id:'',ts:new Date().toISOString(),rid:ME?.id||null,rname:ME?.name||'Unknown',ac:S.area,area:AREAS[S.area][0],sub:S.sub,shop:S.shop.trim(),addr:S.addr.trim(),muf:S.muf,skus:[...S.sel.keys()].map(i=>M.find(x=>x.id===i)).filter(Boolean).map(x=>({...snap(x),qty:S.sel.get(x.id)||1}))};
 if(!S.dup&&all().some(s=>ld(s.ts)===ld(Date.now())&&nk(s)===nk(rec))){S.dup=true;render();scrollTo(0,99999);return}
 S.busy=true;render();
 rec.id='SRV-'+ld(Date.now()).replace(/-/g,'').slice(2)+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
 L.push(rec);LS.s('dc_surveys',L);
 if(DB)try{await DB.doc('surveys/'+rec.id).set(rec);const y=LS.g('dc_syn',[]);y.push(rec.id);LS.s('dc_syn',y)}catch(e){msg('Saved on this device; will sync later')}
 resetF();S.busy=false;S.done=rec;render();scrollTo(0,0)}

/* ---------- DATA ---------- */
let F={area:'',brand:'',muf:'',rs:'',from:'',to:'',shop:'',scope:'all',grp:'sku',asc:false};
function renderData(){
 $('#nav').innerHTML='';
 const opt=(a)=>a.map(v=>`<option>${E(v)}</option>`).join('');
 $('#main').innerHTML=`<div class=card><div class=fl><select data-f=area><option value="">All specific areas</option>${opt(SUBS.map(x=>x[1]))}</select><select data-f=brand><option value="">All brands</option>${opt([...new Set(M.map(x=>x.brand))])}</select><select data-f=muf><option value="">Muffin format: all</option><option>Box</option><option>Open</option></select><select data-f=rs><option value="">All researchers</option>${opt([...new Set(all().map(x=>x.rname).filter(Boolean))])}</select><input type=date data-f=from><input type=date data-f=to><input data-f=shop placeholder="Shop name contains…"></div>
 <div class=fl><select data-f=scope><option value=all>Scope: all brands</option><option value=dan>Dan Cake only</option><option value=cmp>Competitors only</option></select><select data-f=grp><option value=sku>Group: SKU</option><option value=brand>Group: Brand</option><option value=mfr>Group: Manufacturer</option><option value=flav>Group: Flavour</option><option value=wt>Group: Weight</option><option value=cat>Group: Category</option></select><button class=btn data-x=sort>Sort: most available</button></div>
 <div class=fl><button class="btn p" data-x=xlsx>⬇ Excel (.xlsx)</button><button class=btn data-x=csvs>⬇ CSV: surveys</button><button class=btn data-x=csvk>⬇ CSV: SKU availability</button></div></div><div id=res></div>`;
 $$('[data-f]').forEach(e=>e.value=F[e.dataset.f]);renderRes()}
function renderRes(){
 const A=all().filter(s=>(!F.area||s.sub===F.area)&&(!F.muf||s.muf===F.muf)&&(!F.rs||s.rname===F.rs)&&(!F.from||ld(s.ts)>=F.from)&&(!F.to||ld(s.ts)<=F.to)&&(!F.shop||s.shop.toLowerCase().includes(F.shop.toLowerCase())));
 const N=A.length,has=(s,f)=>s.skus.some(f),pc=(a,b)=>b?Math.round(a*1000/b)/10+'%':'–',dn=A.filter(s=>has(s,D)).length,cn=A.filter(s=>has(s,x=>!D(x))).length;
 const kf={brand:x=>x.brand,mfr:x=>x.mfr,sku:x=>`${x.brand} · ${x.name} · ${x.flav} · ${x.wt}`,flav:x=>x.flav||'—',wt:x=>x.wt||'—',cat:x=>x.cat},f=kf[F.grp];
 const ok=x=>(F.scope==='all'||(F.scope==='dan')===D(x))&&(!F.brand||x.brand===F.brand),cnt=new Map();
 act().filter(ok).forEach(x=>cnt.set(f(x),0));A.forEach(s=>new Set(s.skus.filter(ok).map(f)).forEach(k=>cnt.set(k,(cnt.get(k)||0)+1)));
 const un=new Map();A.forEach(s=>s.skus.filter(ok).forEach(x=>un.set(f(x),(un.get(f(x))||0)+(x.qty||1))));
 const rows=[...cnt].sort((a,b)=>F.asc?a[1]-b[1]:b[1]-a[1]).slice(0,80);
 const ar=SUBS.map(([k,s])=>{const a=A.filter(x=>x.sub===s);return`<tr><td>${s} <small style="display:inline">${k}</small></td><td>${a.length}</td><td>${pc(a.filter(x=>has(x,D)).length,a.length)}</td><td>${pc(a.filter(x=>has(x,y=>!D(y))).length,a.length)}</td></tr>`}).join('');
 const mb=A.filter(s=>s.muf==='Box').length;
 $('#res').innerHTML=`<div class=kp><div>Shops surveyed<b>${N}</b></div><div>With Dan Cake<b>${dn}</b>${pc(dn,N)}</div><div>With competitors<b>${cn}</b>${pc(cn,N)}</div><div>Muffins: Box / Open<b>${mb} / ${N-mb}</b></div><div>Researchers<b>${new Set(A.map(s=>s.rname)).size}</b></div></div>
 <div class=card style="margin-top:12px"><h3>Presence by area (% of shops surveyed)</h3><table><tr><th>Area</th><th>Shops</th><th>Dan Cake</th><th>Competitor</th></tr>${ar}</table></div>
 <div class=card><h3>SKU presence — ${rows.length} rows</h3>${rows.map(([l,c])=>`<div class=r><span>${E(l)}</span><span>${c}/${N}${un.get(l)?' · '+un.get(l)+' pcs':''}</span><b>${pc(c,N)}</b><i style="width:${N?c*100/N:0}%"></i></div>`).join('')||'<p class=mut>No data.</p>'}<p class=mut>'pcs' = total quantity recorded by researchers. Presence % = shops where available ÷ shops surveyed. It is numeric distribution in the sampled shops, not market share.</p></div>`}
const csv=a=>'\ufeff'+[Object.keys(a[0]),...a.map(r=>Object.values(r))].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
function tables(){const A=all(),tm=s=>new Date(s.ts).toLocaleTimeString('en-GB');
 return{sv:A.map(s=>({'Survey ID':s.id,'Researcher':s.rname||'','Date':ld(s.ts),'Time':tm(s),'Dhaka Area':s.area,'Area Code':s.ac,'Specific Area':s.sub,'Shop Name':s.shop,'Shop Address':s.addr,'Muffin Selling Format':s.muf,'SKUs Selected':s.skus.length,'Total Quantity':s.skus.reduce((a,x)=>a+(x.qty||1),0)})),
 sk:A.flatMap(s=>s.skus.map(x=>({'Survey ID':s.id,'Researcher':s.rname||'','Date':ld(s.ts),'Time':tm(s),'Dhaka Area':s.area,'Specific Area':s.sub,'Shop Name':s.shop,'Shop Address':s.addr,'Manufacturer':x.mfr,'Brand':x.brand,'SKU Name':x.name,'Flavour':x.flav,'Net Weight':x.wt,'MRP (Tk)':x.mrp??'','Quantity':x.qty??1,'Category':x.cat})))}}
async function save(name,data){
 try{const d=await window.claude.use('downloads');if(d){await d.save({filename:name,data});return}}catch(e){if(e&&e.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=name;a.click()}
async function exp(k){
 const t=tables(),day=ld(Date.now());if(!t.sv.length)return msg('No surveys to export yet');
 if(k==='csvs')return save(`Surveys_${day}.csv`,new Blob([csv(t.sv)],{type:'text/csv'}));
 if(k==='csvk')return save(`SKU_Availability_${day}.csv`,new Blob([csv(t.sk.length?t.sk:[{'Survey ID':''}])],{type:'text/csv'}));
 if(!window.XLSX)return msg('Excel library unavailable — use CSV');
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(t.sv),'Surveys');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(t.sk),'SKU_Availability');
 save(`Dan_Cake_Retail_Audit_${day}.xlsx`,new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/octet-stream'}))}

/* ---------- ADMIN ---------- */
function saveM(){LS.s('dc_master',M);if(DB)DB.doc('master/skus').set({list:M}).catch(()=>msg('Saved on this device only'))}
function renderAdmin(){
 $('#nav').innerHTML='';const dl=(id,a)=>`<datalist id=${id}>${[...new Set(a)].map(v=>`<option value="${E(v)}">`).join('')}</datalist>`;
 $('#main').innerHTML=`<div class=card><h3>Upload SKU master (.xlsx / .csv)</h3><p class=mut>Columns: Manufacturer, SKU Name, Flavour, Net Weight, MRP.</p><input type=file id=up accept=".xlsx,.xls,.csv">${S.pend?`<p>${S.pend.length} SKUs read. <button class="btn p" data-x=apply>Replace master list</button> <button class=btn data-x=cancel>Cancel</button></p>`:''}</div>
 <div class=card><h3>Add SKU / new competitor / category</h3><div class=fl><input id=n_brand list=dl_b placeholder="Brand (new name = new competitor)"><input id=n_mfr placeholder="Manufacturer (optional)"><input id=n_name placeholder="SKU name"><input id=n_flav placeholder=Flavour><input id=n_wt placeholder="Net weight, e.g. 140 gm"><input id=n_mrp type=number placeholder="MRP (Tk)"><input id=n_cat list=dl_c placeholder="Category"></div><button class="btn p" data-x=add>Add SKU</button></div>${dl('dl_b',M.map(x=>x.brand))}${dl('dl_c',M.map(x=>x.cat))}
 <input id=aq placeholder="Search master list (${M.length} SKUs)" value="${E(S.aq)}"><div id=al class=card style="margin-top:10px"></div>`;renderAL()}
function renderAL(){const q=S.aq.toLowerCase();$('#al').innerHTML=M.filter(x=>!q||`${x.brand} ${x.name} ${x.flav}`.toLowerCase().includes(q)).map(x=>`<div class="ar ${x.off?'off':''}"><div><b>${E(x.name)}</b> <small>${E(x.brand)} · ${E(x.flav)} · ${E(x.cat)}</small></div><input data-e=wt data-id=${x.id} value="${E(x.wt)}" placeholder=weight><input data-e=mrp data-id=${x.id} type=number value="${x.mrp??''}" placeholder=MRP><button class=btn data-off=${x.id}>${x.off?'Restore':'Discontinue'}</button></div>`).join('')}
async function parseUp(f){
 if(!window.XLSX)return msg('Excel library unavailable');
 const wb=XLSX.read(await f.arrayBuffer()),rs=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});let mf='';
 S.pend=rs.filter(r=>r['SKU Name']).map((r,i)=>{mf=r.Manufacturer||mf;const p=String(r.MRP).match(/\d+/);return{id:'U'+Date.now().toString(36)+i,mfr:mf,brand:brandOf(mf,r['SKU Name']),name:String(r['SKU Name']),flav:String(r.Flavour),wt:String(r['Net Weight']).replace(/(\d)gm/,'$1 gm'),mrp:p?+p[0]:null,cat:catOf(String(r['SKU Name']))}});render()}

/* ---------- EVENTS ---------- */
const go=n=>{S.step=n;S.dup=false;saveDraft();render();scrollTo(0,0)};
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){S.tab=d.tab;render();scrollTo(0,0)}
 else if(d.a){S.area=d.a;if(!AREAS[d.a][1].includes(S.sub))S.sub='';saveDraft();render()}
 else if(d.s){S.sub=d.s;saveDraft();render()}
 else if(d.m){S.muf=d.m;saveDraft();render()}
 else if(d.q){const v=Math.max(1,(S.sel.get(d.id)||1)+ +d.q);S.sel.set(d.id,v);t.parentElement.querySelector('.qi').value=v;saveDraft()}
 else if(d.go!==undefined)go(+d.go);
 else if(t.id==='back')go(S.step-1);
 else if(t.id==='next'){const er=V[S.step]();if(er)return msg(er);S.step===4?submit():go(S.step+1)}
 else if(t.id==='again'){const a=S.area,s=S.sub;S.done=null;resetF();S.area=a;S.sub=s;go(1)}
 else if(t.id==='fresh'){S.done=null;S.area=S.sub='';resetF();render()}
 else if(d.x==='xlsx'||d.x==='csvs'||d.x==='csvk')exp(d.x);
 else if(d.x==='sort'){F.asc=!F.asc;t.textContent=F.asc?'Sort: least available':'Sort: most available';renderRes()}
 else if(d.x==='cancel'){S.pend=null;render()}
 else if(d.x==='apply'){M=S.pend;S.pend=null;saveM();render();msg('Master list replaced')}
 else if(d.x==='add'){const g=i=>$('#'+i).value.trim(),b=g('n_brand'),n=g('n_name');if(!b||!n)return msg('Brand and SKU name are required');
  M.push({id:'N'+Date.now().toString(36),mfr:g('n_mfr')||b,brand:b,name:n,flav:g('n_flav'),wt:g('n_wt'),mrp:g('n_mrp')?+g('n_mrp'):null,cat:g('n_cat')||catOf(n)});saveM();render();msg('SKU added')}
 else if(d.off){const x=M.find(y=>y.id===d.off);x.off=!x.off;saveM();renderAL()}});
const onIn=e=>{const t=e.target,d=t.dataset;
 if(t.id==='shop'){S.shop=t.value;saveDraft()}else if(t.id==='addr'){S.addr=t.value;saveDraft()}
 else if(t.id==='q'){S.q=t.value;renderList()}else if(t.id==='aq'){S.aq=t.value;renderAL()}
 else if(t.id==='up'&&t.files[0])parseUp(t.files[0]);
 else if(t.classList.contains('qi')){const v=Math.max(1,parseInt(t.value)||1);S.sel.set(d.id,v);if(e.type==='change')t.value=v;saveDraft()}
 else if(t.type==='checkbox'&&d.id){const r=t.closest('.sku');t.checked?S.sel.set(d.id,S.sel.get(d.id)||1):(S.sel.delete(d.id),r.querySelector('.qi').value=1);r.classList.toggle('on',t.checked);counts();saveDraft()}
 else if(d.f){F[d.f]=t.value;renderRes()}
 else if(d.e&&e.type==='change'){const x=M.find(y=>y.id===d.id);x[d.e]=d.e==='mrp'?(t.value===''?null:+t.value):t.value;saveM();msg('Saved')}};
document.addEventListener('input',onIn);document.addEventListener('change',onIn);

render();
(async()=>{
 try{const u=await window.claude.use('user');if(u){CAN=!!(await u.canEdit());const me=await u.me();ME={id:me.id,name:me.name||'Researcher'}}}catch(e){}
 try{DB=await window.claude.use('db')}catch(e){}
 renderHd();
 if(!DB)return;
 try{DB.collection('surveys').onSnapshot(q=>{R=q.docs.map(d=>d.data());if(S.tab==='data')renderRes()},()=>{})}catch(e){}
 try{DB.doc('master/skus').onSnapshot(d=>{if(d.exists&&Array.isArray(d.data().list)){M=d.data().list;LS.s('dc_master',M);if(S.tab==='survey'&&S.step===2&&!S.done)renderList();else if(S.tab==='admin'&&!/INPUT/.test(document.activeElement.tagName))renderAdmin()}},()=>{})}catch(e){}
 const y=LS.g('dc_syn',[]);for(const s of L)if(!y.includes(s.id))try{await DB.doc('surveys/'+s.id).set(s);y.push(s.id)}catch(e){}LS.s('dc_syn',y);
})();
</script></body></html>
